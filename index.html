<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf6f1">
  <meta name="description" content="一个小小的手机网页访问测试。">
  <title>一份小小的期待 · 手机访问测试</title>
  <style>
    :root{color-scheme:light;--paper:#faf6f1;--ink:#342d2e;--muted:#6e6264;--rose:#984d60;--line:#e6d8d6}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif}
    main{max-width:560px;margin:auto;padding:calc(32px + env(safe-area-inset-top)) 24px calc(36px + env(safe-area-inset-bottom))}
    .eyebrow{font-size:13px;letter-spacing:2px;color:var(--rose)}header{padding-top:14px}h1{font-size:clamp(32px,9vw,44px);line-height:1.3;letter-spacing:-1px;margin:18px 0 14px}p{margin:12px 0;color:var(--muted)}
    .art{height:140px;display:grid;place-items:center;margin:20px 0}.heart{width:112px;height:112px;color:var(--rose);filter:drop-shadow(0 12px 22px #984d6022);animation:float 4s ease-in-out infinite}
    .panel{background:#fffdfb;border:1px solid var(--line);border-radius:22px;padding:24px;margin:20px 0}.label{font-size:14px;color:var(--muted)}.days{display:flex;align-items:baseline;gap:8px;margin:4px 0}.days strong{font-size:64px;line-height:1.2;letter-spacing:-3px;font-variant-numeric:tabular-nums}.days span{color:var(--muted)}
    button{display:block;width:100%;min-height:50px;padding:12px 18px;border-radius:14px;border:1px solid var(--rose);font:inherit;cursor:pointer;touch-action:manipulation;transition:background .18s,opacity .18s}button:focus-visible{outline:3px solid var(--ink);outline-offset:4px}button:active{opacity:.75}.primary{background:var(--rose);color:white}.secondary{background:transparent;color:var(--rose);margin-top:18px}button:disabled{opacity:.6;cursor:wait}
    .note{padding:16px 0 0;color:var(--ink)}[hidden]{display:none!important}.checks{margin:16px 0 0;padding:0;list-style:none}.checks li{border-top:1px solid var(--line);padding:12px 0;font-size:14px}.checks li:last-child{padding-bottom:0}footer{font-size:13px;color:var(--muted);text-align:center}small{font-size:13px;color:var(--muted)}
    @keyframes float{50%{transform:translateY(-8px) rotate(-4deg)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
    @media(max-width:350px){main{padding-left:16px;padding-right:16px}.panel{padding:20px}h1{font-size:30px}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">一份小小的期待 / 访问测试</div>
    <header><h1>把美好的日子，<br>慢慢装进网页里。</h1><p>如果你看到了这里，我们的小网页就已经抵达你的手机。</p></header>
    <div class="art" aria-hidden="true"><svg class="heart" viewBox="0 0 100 100"><path fill="currentColor" d="M50 86C39 77 9 58 9 34 9 12 37 6 50 25 63 6 91 12 91 34 91 58 61 77 50 86Z"/><path fill="none" stroke="#fff4ed" stroke-linecap="round" stroke-width="4" d="M23 34c0-8 7-13 14-10"/></svg></div>
    <section class="panel" aria-labelledby="count-title"><div class="label" id="count-title">距离 2027 年 1 月 6 日</div><div class="days"><strong id="days">—</strong><span id="day-unit">天</span></div><small id="count-note">按北京时间计算</small></section>
    <button class="primary" id="open-note" type="button" aria-expanded="false" aria-controls="note">点开一份小惊喜</button>
    <p class="note" id="note" hidden>愿平凡的每一天，都有值得珍藏的小事。<br>这只是访问测试，属于我们的故事，之后再慢慢写。</p>
    <section class="panel" aria-labelledby="check-title"><h2 id="check-title" style="font-size:19px;margin:0">现在，试试它好不好用</h2><ul class="checks"><li>页面与图形：已显示</li><li id="script-state">交互脚本：尚未运行</li><li id="network-state" role="status">在线请求：尚未检测</li></ul><button class="secondary" id="retry" type="button">重新检测连接</button><noscript><p>浏览器未运行脚本，按钮与倒计时暂不可用。</p></noscript></section>
    <footer>手机访问测试 · 第 1 版<br>仅含测试内容，无需登录</footer>
  </main>
  <script>
    'use strict';
    const byId = id => document.getElementById(id);
    // 使用显式时区和日历日，避免手机所在地影响倒计时。
    function remainingDays(now) {
      const offset = 8 * 60 * 60 * 1000;
      const today = Math.floor((now + offset) / 86400000);
      const target = Math.floor((Date.parse('2027-01-06T00:00:00+08:00') + offset) / 86400000);
      return Math.max(0, target - today);
    }
    function updateCountdown() {
      const days = remainingDays(Date.now());
      byId('days').textContent = String(days);
      byId('count-note').textContent = days === 0 ? '生日当天或日期已到，愿美好继续。' : '按北京时间计算';
    }
    async function checkConnection() {
      const button = byId('retry');
      const status = byId('network-state');
      button.disabled = true;
      status.textContent = '在线请求：检测中…';
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 12000);
      try {
        const response = await fetch('./probe.json?t=' + Date.now(), {cache:'no-store', signal:controller.signal});
        if (!response.ok) throw new Error('请求未成功');
        const result = await response.json();
        if (result.ok !== true) throw new Error('返回内容不匹配');
        status.textContent = '在线请求：通过，刚刚成功连接网站';
      } catch {
        status.textContent = '在线请求：未通过，请切换网络后重试';
      } finally {
        clearTimeout(timer);
        button.disabled = false;
      }
    }
    byId('open-note').addEventListener('click', () => {
      const note = byId('note');
      note.hidden = !note.hidden;
      byId('open-note').setAttribute('aria-expanded', String(!note.hidden));
      byId('open-note').textContent = note.hidden ? '点开一份小惊喜' : '收起这份小惊喜';
    });
    byId('retry').addEventListener('click', checkConnection);
    byId('script-state').textContent = '交互脚本：已运行';
    updateCountdown();
    setInterval(updateCountdown, 60000);
    checkConnection();
  </script>
</body>
</html>
